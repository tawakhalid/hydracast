name: Release

# Builds the Windows installer and publishes it to a GitHub Release.
# Trigger by pushing a version tag (v1.0.0), or run it by hand from the
# Actions tab to produce build artifacts without cutting a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Guards the parsers that face each platform's API. These are the pieces
      # most likely to break from a change nobody here controls.
      #
      # `test:ci` rather than `test`: the full suite ends with test:pipeline,
      # which starts a real RTMP server and pushes an ffmpeg feed through it.
      # That needs a machine where a process can publish to its own loopback,
      # and a GitHub runner is not one - it fails with "No encoder is publishing
      # into the local ingest" regardless of the code. Running it here would
      # block every release on an environment problem, so it stays a local
      # check and CI runs everything that does not need a live encoder.
      - name: Test
        run: npm run test:ci

      # electron-builder only packages what electron-vite has already compiled
      # into out/, so this step is required before packaging.
      - name: Compile main, preload and renderer
        run: npm run build

      - name: Build installer and portable exe
        run: npx electron-builder --win nsis portable --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hydracast-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
